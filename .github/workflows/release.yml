name: release

# Tag vX.Y.Z: build firmware + image, push to GHCR, attest both, create the GitHub release.
# Manual run (workflow_dispatch): always a dry run. It builds everything but pushes and
# publishes nothing; the firmware files are kept as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {} # each job lists what it needs

env:
  IMAGE: ghcr.io/robinlanger/glancebox
  # Real publishing happens only on a pushed v* tag; everything else is a dry run.
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
      packages: write # push to GHCR
      id-token: write # sign the build attestations (Sigstore)
      attestations: write # store the build attestations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read version and check the tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file (v$version)"
            exit 1
          fi

      - name: Refuse to republish an existing release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::a GitHub release for v$VERSION already exists; nothing was pushed"
            exit 1
          fi

      - name: Extract changelog section
        run: python3 tools/changelog_section.py "$VERSION" CHANGELOG.md | tee release-notes.md

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build firmware
        run: |
          pip install platformio==6.2.0
          cd firmware
          pio run -e ultra

      - name: Size check and release files
        run: |
          python3 tools/check_fw_size.py firmware/.pio/build/ultra/firmware.bin firmware/size-limit.txt
          mkdir dist
          bin="dist/glancebox-ultra-$VERSION.bin"
          cp firmware/.pio/build/ultra/firmware.bin "$bin"
          # The embedded version tag must match VERSION, exactly once.
          [ "$(strings -a "$bin" | grep -Fxc "GBVER:$VERSION")" -eq 1 ]
          (cd dist && md5sum "glancebox-ultra-$VERSION.bin" > "glancebox-ultra-$VERSION.bin.md5" \
            && sha256sum "glancebox-ultra-$VERSION.bin" > "glancebox-ultra-$VERSION.bin.sha256")
          cat dist/*.md5 dist/*.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push unless dry run)
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      # Build provenance, checkable with `gh attestation verify` (see docs/RELEASING.md).
      - name: Attest the image
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      - name: Attest the firmware
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.bin

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
