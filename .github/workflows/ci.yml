name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.lock
            server/requirements-dev.lock
      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lock files match their inputs (commands as in the lock headers)
        run: |
          pip install uv==0.11.16
          uv pip compile -q --universal --python-version 3.12 --generate-hashes \
            requirements.in -o requirements.lock
          uv pip compile -q --universal --python-version 3.12 --generate-hashes \
            requirements-dev.in -o requirements-dev.lock
          git diff --exit-code requirements.lock requirements-dev.lock
      - name: Ruff
        run: ruff check . ../pages
      - name: Tests (browser tests run in the server-image job)
        run: pytest -q -m "not browser"

  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build test image (runtime + test tools)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: test
          load: true
          push: false
          tags: glancebox:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Browser tests inside the image (same restrictions as docker-compose.yml)
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges
          glancebox:ci-test pytest -q -m browser
      - name: Build default image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: glancebox:ci
          cache-from: type=gha
      - name: Default image ships no test tools
        run: |
          if out=$(docker run --rm --cap-drop ALL --security-opt no-new-privileges \
              glancebox:ci python -c "import pytest" 2>&1); then
            echo "::error::pytest is importable in the default image"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "No module named 'pytest'"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Known vulnerabilities in the runtime dependencies
        run: pip-audit --require-hashes --disable-pip -r server/requirements.lock

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Native unit tests
        working-directory: firmware
        run: pio test -e native
      - name: Build firmware
        working-directory: firmware
        run: pio run -e ultra -e spike -e ultra-crashtest
      - name: Size check
        run: python3 tools/check_fw_size.py firmware/.pio/build/ultra/firmware.bin firmware/size-limit.txt
      - name: Copy bin out of the hidden .pio directory
        run: |
          mkdir dist
          cp firmware/.pio/build/ultra/firmware.bin dist/glancebox-ultra-ci.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-ultra-${{ github.sha }}
          path: dist/glancebox-ultra-ci.bin
          if-no-files-found: error

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: EN/DE parity
        run: python3 tools/check_docs_parity.py
      - name: Project site builds (strict)
        run: |
          pip install -r requirements-docs.txt
          NO_MKDOCS_2_WARNING=1 mkdocs build --strict
