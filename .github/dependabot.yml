# Weekly update PRs for the pinned dependencies: Python locks, the Docker base image digest and
# the commit-pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
