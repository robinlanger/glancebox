services:
  glancebox:
    build: .
    image: glancebox:dev
    container_name: glancebox
    restart: unless-stopped
    # No Linux capabilities and no privilege gain: the server and Chromium need neither.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Secrets (tokens, keys) go into a .env file next to this file and are referenced
    # as ${NAME} in config.yaml. After editing .env run `docker compose up -d`;
    # `docker compose restart` does not re-read it.
    env_file:
      - path: .env
        required: false
    ports:
      # Host port: set GLANCEBOX_PORT in a .env file next to this file if 8080 is taken.
      - "${GLANCEBOX_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Your own pages; create the folder first (mkdir pages-custom), it may be empty.
      - ./pages-custom:/config/pages:ro
