# Glance Box server configuration (copy to config.yaml; mounted at /config/config.yaml in Docker).
interval: 30              # default display time per page, in seconds
timezone: Europe/Berlin
lang: de                  # language for built-in pages (de or en)
custom_pages_dir: /config/pages   # your own pages (<type>/page.py + template.html); may be missing
# push_key: ${GLANCEBOX_PUSH_KEY}   # only needed for pushed data (ai page, provider claude)

pages:
  - type: bahn
    station: "Frankfurt(Main)Hbf"
    via: [Wiesbaden, Mainz]
    platforms: ["1", "2"]
    limit: 4
    title: Heimweg
    refresh: 60           # data at most once a minute (DB rule, minimum 60 for bahn)
  # - type: weather
  #   location: Frankfurt am Main
  #   refresh: 60           # minimum 60; Open-Meteo is asked at most every 15 min
  # - type: kuma
  #   url: http://192.168.1.20:3001   # your Uptime Kuma
  #   slug: home                    # slug of its status page
  #   refresh: 30
  # - type: homeassistant
  #   url: ${HA_URL}                  # e.g. HA_URL=http://homeassistant.lan:8123 in .env
  #   token: ${HA_TOKEN}              # long-lived access token, only in .env
  #   title: Solar
  #   refresh: 30
  #   entities:                       # 1-4 as tiles, up to 6 as a list
  #     - sensor.pv_power
  #     - entity: sensor.grid_power
  #       label: Grid
  # - type: energy                    # energy flow; arrows need firmware 0.7.0 or newer
  #   url: ${HA_URL}                  # same .env values as homeassistant
  #   token: ${HA_TOKEN}
  #   title: Power                    # refresh defaults to 5 here (minimum 2)
  #   rows:                           # 1-4 of grid, pv, battery, gas, water, wallbox
  #     - type: grid
  #       entity: sensor.grid_power   # positive = import, negative = export
  #     - type: pv
  #       entity: sensor.pv_power
  #     - type: battery
  #       entity: sensor.battery_power  # positive = discharging, negative = charging
  #       soc: sensor.battery_level     # optional
  # - type: printer                 # 3D printer; refresh defaults to 10 here (minimum 5)
  #   source: moonraker             # Klipper; octoprint, prusalink and hass: docs/en/templates/printer.md
  #   url: http://drucker.local:7125
  #   # api_key: ${MOONRAKER_KEY}   # only if Moonraker does not list this server in trusted_clients
  # - type: ai
  #   provider: claude      # values from Claude Code's status line, needs push_key above
  #   refresh: 30
  - type: url
    url: http://homeserver.lan/status-240
    duration: 15          # show this page for 15 s instead of the default interval
    refresh: 30           # re-render every 30 s
